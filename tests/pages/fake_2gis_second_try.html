<!doctype html>
<meta charset="utf-8">
<title>подделка страницы 2ГИС, оживающей со второго раза</title>

<!--
  Страница, отдающая токен только после перезагрузки.

  Изображает то, ради чего вторая попытка и появилась: приложение не доехало
  с первого раза. Если программа сдастся после первой попытки, тест покраснеет —
  другого способа проверить перезагрузку снаружи нет.

  Признак «это уже второй заход» хранится в window.name: он переживает
  перезагрузку той же вкладки и, в отличие от localStorage, работает на
  file:// без плясок с origin.
-->

<h1>Карта</h1>
<p id="состояние">первый заход</p>

<script>
  var TOKEN = "0123456789abcdef0123456789abcdef01234567";

  if (window.name === "перезагружено") {
    document.getElementById("состояние").textContent = "второй заход";
    try {
      new WebSocket(
        "wss://zond.api.2gis.ru/api/1.1/user/ws" +
        "?appVersion=6.31.0&channels=markers,sharing,routes&token=" + TOKEN
      );
    } catch (error) {
      // соединение не состоится, и это неважно: событие уже произошло
    }
  } else {
    window.name = "перезагружено";
  }
</script>
