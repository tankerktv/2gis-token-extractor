<!doctype html>
<meta charset="utf-8">
<title>подделка страницы 2ГИС</title>

<!--
  Страница для дымового теста браузерной обвязки.

  Изображает то, что делает настоящий 2gis.ru, в трёх существенных чертах:

  * открывает веб-сокет с токеном в параметре запроса;
  * делает обычный запрос с токеном в параметре — так токен приезжал во всех
    наблюдениях на живом аккаунте, сокета там могло и не быть;
  * подсовывает посторонние sha1 — отпечаток картинки и версию сборки, — на
    которые перехватчик не должен клюнуть.

  Настоящего 2ГИС здесь нет и быть не может: тест обязан проходить в CI без
  аккаунта, без сети и за секунды.
-->

<h1>Карта</h1>
<p>Отпечаток тайла: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa</p>
<img src="tile.png?hash=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb" alt="">

<script>
  // версия сборки — тоже сорок шестнадцатеричных знаков, тоже приманка
  window.__buildId = "cccccccccccccccccccccccccccccccccccccccc";

  var TOKEN = "0123456789abcdef0123456789abcdef01234567";

  // обычный запрос с токеном: адрес заведомо недоступен, но событие request
  // возникает до того, как выяснится, что ответа не будет
  fetch("https://zond.api.2gis.ru/api/1.1/user/profile?token=" + TOKEN).catch(function () {});

  // сокет с токеном в адресе — самый надёжный источник из всех
  setTimeout(function () {
    try {
      new WebSocket(
        "wss://zond.api.2gis.ru/api/1.1/user/ws" +
        "?appVersion=6.31.0&channels=markers,sharing,routes&token=" + TOKEN
      );
    } catch (error) {
      // соединение не состоится, и это неважно: событие уже произошло
    }
  }, 300);
</script>
