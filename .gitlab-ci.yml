# GitLab — источник истины. GitHub — публичное зеркало: туда уезжает main,
# там же собираются релизы (у GitHub Actions есть встроенный токен, и ради
# сборок под три системы не нужен свой раннер).
#
# Схема веток:
#   development — рабочая, НЕ зеркалируется
#   main        — то, что опубликовано; один в один уезжает в GitHub
#
# Публикация = слить development в main и запушить main.
# Релиз      = поставить тег vX.Y.Z на main.
#
# Релизы здесь НЕ создаются: это делает .github/workflows/release.yml.
# Дублировать создание релиза с двух сторон нельзя — второй получит 422
# и покрасит прогон.
#
# Переменные проекта (Settings -> CI/CD -> Variables):
#   GITHUB_TOKEN — fine-grained PAT на репозиторий-зеркало. Прав нужно ДВА:
#                  Contents: read/write и Workflows: read/write.
#
#                  Второе забывается легко, а стоит дорого: мы публикуем
#                  каталог .github/workflows/, и правка файлов workflow
#                  закрыта отдельным правом. Без него GitHub отвергает push
#                  ЦЕЛИКОМ, а не частично:
#
#                    ! [remote rejected] ... -> main (refusing to allow a
#                    Personal Access Token to create or update workflow
#                    `.github/workflows/release.yml` without `workflow` scope)
#
#                  Формулировка про scope — язык классических токенов;
#                  у fine-grained это право называется Workflows. Права
#                  правятся у существующего токена, значение не меняется,
#                  поэтому переменную здесь после исправления трогать не надо.
#
#                  Masked, без Protect (иначе не виден прогонам на тегах).
#   GITHUB_REPO  — необязательна, по умолчанию берётся значение ниже.
#
# Про ожидание: раннер общий и однопоточный, очередь в двадцать минут —
# это норма, а не поломка. Состояние смотреть с фильтром по проекту, иначе
# наткнёшься на чужие джобы и сделаешь неверный вывод.

variables:
  GITHUB_REPO: "tankerktv/2gis-token-extractor"
  PUBLIC_BRANCH: "main"

stages: [validate, mirror]

default:
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache git >/dev/null

# --- проверки ---------------------------------------------------------------

validate:lint:
  stage: validate
  script:
    - pip install --quiet --disable-pip-version-check ruff
    - ruff check src tests tools

validate:python:
  stage: validate
  script:
    - python -m compileall -q src tools

validate:tests:
  stage: validate
  script:
    # Playwright не ставим: тесты проверяют логику — опознание токена, разбор
    # адреса сокета, разбор ответа профиля, коды возврата. Браузер для этого
    # не нужен, а весит он сотню мегабайт. Как пакет находится без установки —
    # см. tests/conftest.py.
    - pip install --quiet --disable-pip-version-check pytest
    - python -m pytest -q

validate:release:
  stage: validate
  script:
    - python tools/check_release.py "$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG

# --- зеркало ----------------------------------------------------------------

mirror:github:
  stage: mirror
  variables:
    # Полная история. По умолчанию раннер клонирует последние 20 коммитов,
    # а тег указывает на более старый: git не может отправить объекты,
    # которых у него нет, и push падает с
    # "did not receive expected object ... remote unpack failed".
    GIT_DEPTH: "0"
  script:
    - test -n "$GITHUB_TOKEN" || { echo "нет переменной GITHUB_TOKEN"; exit 1; }
    - apk add --no-cache bash >/dev/null
    - git remote remove github 2>/dev/null || true
    - git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"
    # Правила публикации живут в скрипте, а не здесь: он же вызывается вручную,
    # и дублировать их в двух местах — верный способ разъехаться.
    - PUBLISH_REMOTE=github PUBLISH_BRANCH="$PUBLIC_BRANCH" bash tools/publish_github.sh
    - echo "опубликовано в https://github.com/${GITHUB_REPO}/tree/${PUBLIC_BRANCH}"
  rules:
    # ЗЕРКАЛИТСЯ ТОЛЬКО main. development сюда не попадает никогда.
    - if: $CI_COMMIT_BRANCH == $PUBLIC_BRANCH
    - if: $CI_COMMIT_TAG
