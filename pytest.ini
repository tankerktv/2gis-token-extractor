[pytest]
testpaths = tests

# Обычный прогон — только логика: опознание токена, разбор адреса сокета,
# разбор ответа профиля, выбор путей, замок и коды возврата. Ни Playwright,
# ни сети, ни секунды ожидания. Как пакет находится без установки —
# см. tests/conftest.py.
#
# Тесты с меткой browser поднимают настоящий Chromium на подставной странице
# и потому по умолчанию пропускаются: браузер весит сотни мегабайт, и держать
# его условием для запуска тестов неправильно. В CI под них отдельная джоба:
#
#     pytest -m browser
#
# Ключ -m из командной строки перекрывает этот addopts, так что специально
# ничего отключать не нужно.
addopts = -m "not browser"

markers =
    browser: поднимает настоящий Chromium (нужен playwright install chromium)
